<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Stock Generator</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f19; color: #f3f4f6; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    function Dashboard() {
      const [keyword, setKeyword] = useState("");
      const [results, setResults] = useState([]);
      const [loading, setLoading] = useState(false);
      const [showGuide, setShowGuide] = useState(false);
      const [sidebarTab, setSidebarTab] = useState("guide");
      const [keywordSearch, setKeywordSearch] = useState("");
      const [copiedBadge, setCopiedBadge] = useState(null);
      const [activePreviewItem, setActivePreviewItem] = useState(null);
      const [savedItems, setSavedItems] = useState([]);

      const loadSavedItems = async () => {
        try {
          const response = await axios.get("http://localhost:5000/api/saved-items");
          setSavedItems(response.data);
        } catch (error) {
          console.error("Gagal memuat item tersimpan:", error);
        }
      };

      React.useEffect(() => {
        loadSavedItems();
      }, []);

      const handleSearch = async () => {
        if (!keyword) return;
        setLoading(true);
        try {
          const response = await axios.post("http://localhost:5000/api/generate", { keyword });
          const formatted = response.data.map((item) => ({
            ...item,
            promptHTML: "",
            htmlPreview: "",
            statusHtmlPreview: "idle",
            statusConvertTsx: "idle",
            statusRender4k: "idle",
            statusSave: "idle",
            previewUrl: "",
            outputPath4k: ""
          }));
          setResults(formatted);
        } catch (error) {
          console.error("Gagal terhubung ke backend:", error);
        } finally {
          setLoading(false);
        }
      };

      const handleInputChange = (index, field, value, isSavedSection = false) => {
        if (isSavedSection) {
          const updated = [...savedItems];
          updated[index] = { ...updated[index], [field]: value };
          setSavedItems(updated);
        } else {
          const updatedResults = [...results];
          updatedResults[index] = { ...updatedResults[index], [field]: value };
          setResults(updatedResults);
        }
      };

      const handleHtmlUpload = (index, file, isSavedSection = false) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const content = e.target.result;
          if (isSavedSection) {
            const updated = [...savedItems];
            updated[index].htmlPreview = content;
            updated[index].statusHtmlPreview = "success";
            setSavedItems(updated);
          } else {
            const updated = [...results];
            updated[index].htmlPreview = content;
            updated[index].statusHtmlPreview = "success";
            setResults(updated);
          }
        };
        reader.readAsText(file);
      };

      const startPolling = (itemId, renderType, isSavedSection = false) => {
        const interval = setInterval(async () => {
          try {
            const response = await axios.get(`http://localhost:5000/api/check-render-status/${itemId}/${renderType}`);
            const data = response.data;

            const setList = isSavedSection ? setSavedItems : setResults;

            if (data.status === "success") {
              clearInterval(interval);
              setList(prevList => {
                const idx = prevList.findIndex(item => item.id === itemId);
                if (idx === -1) return prevList;
                const updated = [...prevList];
                if (renderType === "preview") {
                  updated[idx] = {
                    ...updated[idx],
                    previewUrl: data.url,
                    statusConvertTsx: "success"
                  };
                } else {
                  updated[idx] = {
                    ...updated[idx],
                    outputPath4k: data.url,
                    statusRender4k: "success"
                  };
                  setTimeout(() => {
                    alert(`Render 4K Selesai!\nFile tersimpan di: ${data.localPath}`);
                  }, 100);
                }
                return updated;
              });
            } else if (data.status === "failed") {
              clearInterval(interval);
              setList(prevList => {
                const idx = prevList.findIndex(item => item.id === itemId);
                if (idx === -1) return prevList;
                const updated = [...prevList];
                if (renderType === "preview") {
                  updated[idx] = { ...updated[idx], statusConvertTsx: "failed" };
                } else {
                  updated[idx] = { ...updated[idx], statusRender4k: "failed" };
                }
                return updated;
              });
              setTimeout(() => {
                alert(`Render ${renderType} gagal: ${data.error}`);
              }, 100);
            }
          } catch (error) {
            console.error("Error polling render status:", error);
          }
        }, 5000);
      };

      const handleGenerate = async (index, isSavedSection = false) => {
        const list = isSavedSection ? savedItems : results;
        const setList = isSavedSection ? setSavedItems : setResults;
        const item = list[index];
        
        const updated = [...list];
        updated[index].statusConvertTsx = "processing-tsx"; // converting HTML -> TSX
        setList(updated);

        try {
          // 1. Convert HTML to TSX
          const convertResponse = await axios.post("http://localhost:5000/api/convert-html-to-tsx", { 
            item
          });
          
          if (!convertResponse.data || !convertResponse.data.success) {
            throw new Error("Gagal mengonversi HTML ke TSX");
          }
          
          const tsxCode = convertResponse.data.promptCode;
          
          // Update status to polling preview
          const nextUpdate = [...list];
          nextUpdate[index].promptCode = tsxCode;
          nextUpdate[index].statusConvertTsx = "processing-preview";
          setList(nextUpdate);

          // 2. Trigger GitHub Actions Render
          const triggerResponse = await axios.post("http://localhost:5000/api/trigger-github-render", {
            item: { ...item, promptCode: tsxCode },
            renderType: "preview"
          });
          
          if (!triggerResponse.data || !triggerResponse.data.success) {
            throw new Error("Gagal memicu render GitHub");
          }
          
          // 3. Start polling for preview
          startPolling(item.id, "preview", isSavedSection);
          
        } catch (error) {
          console.error("Gagal memproses render:", error);
          const finalUpdate = [...list];
          finalUpdate[index].statusConvertTsx = "failed";
          setList(finalUpdate);
          alert(`Gagal memproses generate: ${error.message}`);
        }
      };

      const handleRender4K = async (index, isSavedSection = false) => {
        const list = isSavedSection ? savedItems : results;
        const setList = isSavedSection ? setSavedItems : setResults;
        const item = list[index];

        const updated = [...list];
        updated[index].statusRender4k = "processing";
        setList(updated);

        try {
          const triggerResponse = await axios.post("http://localhost:5000/api/trigger-github-render", {
            item,
            renderType: "4k"
          });
          
          if (!triggerResponse.data || !triggerResponse.data.success) {
            throw new Error("Gagal memicu render 4K di GitHub");
          }
          
          // Start polling for 4K render
          startPolling(item.id, "4k", isSavedSection);
        } catch (error) {
          console.error("Gagal render 4K:", error);
          const finalUpdate = [...list];
          finalUpdate[index].statusRender4k = "failed";
          setList(finalUpdate);
          alert(`Gagal memproses render 4K: ${error.message}`);
        }
      };

      const handleSaveItem = async (index, isSavedSection = false) => {
        const list = isSavedSection ? savedItems : results;
        const setList = isSavedSection ? setSavedItems : setResults;

        const updated = [...list];
        updated[index].statusSave = "processing";
        setList(updated);

        try {
          const response = await axios.post("http://localhost:5000/api/save-item", {
            item: list[index]
          });
          
          const finalUpdate = [...list];
          finalUpdate[index].statusSave = "success";
          setList(finalUpdate);
          
          loadSavedItems();
          alert("Item berhasil disimpan ke database lokal!");
        } catch (error) {
          console.error("Gagal menyimpan item:", error);
          const finalUpdate = [...list];
          finalUpdate[index].statusSave = "failed";
          setList(finalUpdate);
        }
      };

      const handleDeleteItem = async (id) => {
        if (!confirm("Apakah Anda yakin ingin menghapus item ini dari database lokal?")) return;
        try {
          await axios.delete(`http://localhost:5000/api/delete-item/${id}`);
          loadSavedItems();
        } catch (error) {
          console.error("Gagal menghapus item:", error);
        }
      };

      const copyToClipboard = (text) => {
        if (navigator && navigator.clipboard) {
          navigator.clipboard.writeText(text);
          alert("Teks berhasil disalin!");
        }
      };

      const copySingleBadge = (tag) => {
        if (navigator && navigator.clipboard) {
          navigator.clipboard.writeText(tag.trim());
          setCopiedBadge(tag.trim());
          setTimeout(() => setCopiedBadge(null), 2000);
        }
      };

      const openSidebar = (tab) => {
        setSidebarTab(tab);
        setShowGuide(true);
      };

      return (
        <div style={{ minHeight: "100vh", backgroundColor: "#0b0f19", color: "#f3f4f6", padding: "30px", fontFamily: "sans-serif" }}>
          {results.length === 0 ? (
            <div style={{ maxWidth: "600px", margin: "100px auto", textAlign: "center" }}>
              <h1 style={{ fontSize: "32px", marginBottom: "10px", background: "linear-gradient(to right, #38bdf8, #a855f7)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", fontWeight: "bold" }}>
                Adobe Stock Live-Scrape & Code Generator
              </h1>
              <p style={{ color: "#9ca3af", marginBottom: "30px", fontSize: "14px" }}>
                Mata-matai kompetitor teratas di USA secara real-time dan edit langsung kodenya sebelum dirender di Cloud.
              </p>
              
              <div style={{ backgroundColor: "#161f32", padding: "20px", borderRadius: "16px", border: "1px solid #1e293b" }}>
                <textarea
                  style={{ width: "100%", backgroundColor: "transparent", border: "none", outline: "none", color: "white", fontSize: "16px", resize: "none" }}
                  placeholder="Masukkan kata kunci... (Contoh: Futuristic Digital Cyber Background)"
                  rows={3}
                  value={keyword}
                  onChange={(e) => setKeyword(e.target.value)}
                />
                <div style={{ textAlign: "right", marginTop: "15px", borderTop: "1px solid #1e293b", paddingTop: "10px" }}>
                  <button
                    onClick={handleSearch}
                    disabled={loading}
                    style={{ backgroundColor: "#38bdf8", color: "#0b0f19", padding: "10px 24px", borderRadius: "8px", border: "none", fontWeight: "bold", cursor: "pointer", opacity: loading ? 0.5 : 1 }}
                  >
                    {loading ? "Menyisir Data & Meracik Kode..." : "Cari Ide & Optimasi ATM"}
                  </button>
                </div>
              </div>
            </div>
          ) : (
            <div style={{ width: "100%", margin: "0 auto" }}>
              <button onClick={() => setResults([])} style={{ background: "none", border: "none", color: "#38bdf8", cursor: "pointer", marginBottom: "20px", fontWeight: "bold" }}>← Cari Kata Kunci Lain</button>
              <h2 style={{ fontSize: "20px", marginBottom: "20px" }}>Pusat Kendali Hasil Analisis Kompetitor & AI Code: <span style={{ color: "#38bdf8" }}>"{keyword}"</span></h2>
              
              <table style={{ width: "100%", borderCollapse: "collapse", backgroundColor: "#111827", borderRadius: "12px", overflow: "hidden", fontSize: "13px", border: "1px solid #1e293b" }}>
                <thead>
                  <tr style={{ backgroundColor: "#1f2937", color: "#e5e7eb", textAlign: "left" }}>
                    <th style={{ padding: "12px", width: "40px" }}>No</th>
                    <th style={{ padding: "12px", width: "220px" }}>Deskripsi Video (Bisa Diedit)</th>
                    <th style={{ padding: "12px", width: "200px" }}>Rekomendasi Judul (Bisa Diedit)</th>
                    <th style={{ padding: "12px", width: "230px" }}>Keywords (Tagging)</th>
                    <th style={{ padding: "12px", width: "110px" }}>Kategori / Durasi</th>
                    <th style={{ padding: "12px", width: "250px" }}>Upload HTML</th>
                    <th style={{ padding: "12px", width: "150px" }}>Aksi</th>
                    <th style={{ padding: "12px", width: "140px" }}>Status</th>
                  </tr>
                </thead>
                <tbody>
                  {results.map((item, index) => (
                    <React.Fragment key={item.id}>
                      <tr style={{ borderBottom: "1px solid #1e293b", verticalAlign: "top" }}>
                        <td style={{ padding: "12px", color: "#9ca3af" }}>{index + 1}</td>
                        
                        <td style={{ padding: "12px" }}>
                          <textarea
                            style={{ width: "100%", backgroundColor: "#1f2937", color: "white", border: "1px solid #374151", borderRadius: "4px", padding: "6px", fontSize: "12px", resize: "vertical" }}
                            rows={4}
                            value={item.deskripsi}
                            onChange={(e) => handleInputChange(index, "deskripsi", e.target.value, false)}
                          />
                          <button onClick={() => copyToClipboard(item.deskripsi)} style={{ background: "none", border: "none", color: "#38bdf8", cursor: "pointer", fontSize: "11px", marginTop: "5px", padding: 0 }}>📋 Salin</button>
                        </td>
                        
                        <td style={{ padding: "12px" }}>
                          <input
                            type="text"
                            style={{ width: "100%", backgroundColor: "#1f2937", color: "white", border: "1px solid #374151", borderRadius: "4px", padding: "6px", fontSize: "12px" }}
                            value={item.judul}
                            onChange={(e) => handleInputChange(index, "judul", e.target.value, false)}
                          />
                          <button onClick={() => copyToClipboard(item.judul)} style={{ background: "none", border: "none", color: "#38bdf8", cursor: "pointer", fontSize: "11px", marginTop: "5px", padding: 0 }}>📋 Salin</button>
                        </td>
                        
                        <td style={{ padding: "12px" }}>
                          <textarea
                            style={{ width: "100%", backgroundColor: "#1f2937", color: "#9ca3af", border: "1px solid #374151", borderRadius: "4px", padding: "6px", fontSize: "11px", resize: "vertical" }}
                            rows={4}
                            value={item.keywords}
                            onChange={(e) => handleInputChange(index, "keywords", e.target.value, false)}
                          />
                          <button onClick={() => copyToClipboard(item.keywords)} style={{ background: "none", border: "none", color: "#38bdf8", cursor: "pointer", fontSize: "11px", marginTop: "5px", padding: 0 }}>📋 Salin Semua</button>
                        </td>
                        
                        <td style={{ padding: "12px", display: "flex", flexDirection: "column", gap: "8px" }}>
                          <span style={{ backgroundColor: "#1e1b4b", color: "#818cf8", padding: "4px 8px", borderRadius: "4px", fontSize: "11px", fontWeight: "bold", textAlign: "center" }}>{item.kategori}</span>
                          <div style={{ fontSize: "11px", color: "#9ca3af" }}>
                            Frames:
                            <input 
                              type="number" 
                              style={{ width: "100%", backgroundColor: "#1f2937", color: "white", border: "1px solid #374151", borderRadius: "4px", padding: "4px", marginTop: "2px" }}
                              value={item.durationInFrames}
                              onChange={(e) => handleInputChange(index, "durationInFrames", Number(e.target.value), false)}
                            />
                          </div>
                        </td>
                        
                        <td style={{ padding: "12px", display: "flex", flexDirection: "column", gap: "8px" }}>
                          <input
                            type="file"
                            accept=".html"
                            style={{ display: "none" }}
                            id={`upload-html-${item.id}`}
                            onChange={(e) => handleHtmlUpload(index, e.target.files[0], false)}
                          />
                          <label
                            htmlFor={`upload-html-${item.id}`}
                            style={{
                              backgroundColor: item.htmlPreview ? "rgba(16, 185, 129, 0.15)" : "rgba(56, 189, 248, 0.1)",
                              color: item.htmlPreview ? "#10b981" : "#38bdf8",
                              border: item.htmlPreview ? "1px solid #10b981" : "1px solid rgba(56, 189, 248, 0.4)",
                              padding: "8px 12px",
                              borderRadius: "6px",
                              cursor: "pointer",
                              display: "inline-block",
                              fontSize: "12px",
                              fontWeight: "bold",
                              textAlign: "center",
                              transition: "all 0.2s"
                            }}
                          >
                            {item.htmlPreview ? "✓ HTML Loaded" : "📂 Upload HTML"}
                          </label>
                          {item.htmlPreview && (
                            <div style={{ fontSize: "11px", color: "#9ca3af", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                              Size: {item.htmlPreview.length} chars
                            </div>
                          )}
                        </td>
                        
                        <td style={{ padding: "12px", display: "flex", flexDirection: "column", gap: "6px" }}>
                          <button
                            onClick={() => handleGenerate(index, false)}
                            disabled={!item.htmlPreview || item.statusConvertTsx === "processing-tsx" || item.statusConvertTsx === "processing-preview"}
                            style={{
                              backgroundColor: (!item.htmlPreview) ? "#374151" : (item.statusConvertTsx === "success" ? "#10b981" : "#38bdf8"),
                              color: (!item.htmlPreview) ? "#9ca3af" : "#0b0f19",
                              padding: "6px 10px",
                              borderRadius: "4px",
                              border: "none",
                              cursor: (!item.htmlPreview) ? "not-allowed" : "pointer",
                              fontSize: "11px",
                              fontWeight: "bold",
                              opacity: (!item.htmlPreview) ? 0.6 : 1
                            }}
                          >
                            {item.statusConvertTsx === "processing-tsx" ? "⏳ Converting..." :
                             item.statusConvertTsx === "processing-preview" ? "⏳ Rendering..." :
                             item.statusConvertTsx === "success" ? "🔄 Regenerate" : "✨ Generate"}
                          </button>
                                  
                          {(item.htmlPreview || item.previewUrl) && (
                            <button
                              onClick={() => setActivePreviewItem(item)}
                              style={{ backgroundColor: "#06b6d4", color: "white", padding: "6px 10px", borderRadius: "4px", border: "none", cursor: "pointer", fontSize: "11px", fontWeight: "bold" }}
                            >
                              👁️ Lihat Preview
                            </button>
                          )}

                          {item.statusConvertTsx === "success" && (
                            <button
                              onClick={() => handleRender4K(index, false)}
                              disabled={item.statusRender4k === "processing"}
                              style={{ backgroundColor: "#ef4444", color: "white", padding: "6px 10px", borderRadius: "4px", border: "none", cursor: "pointer", fontSize: "11px", fontWeight: "bold" }}
                            >
                              {item.statusRender4k === "processing" ? "⏳ Render 4K..." : "🚀 Render 4K"}
                            </button>
                          )}

                          <button
                            onClick={() => handleSaveItem(index, false)}
                            disabled={item.statusSave === "processing"}
                            style={{
                              backgroundColor: item.statusSave === "success" ? "#047857" : "#4b5563",
                              color: "white",
                              padding: "6px 10px",
                              borderRadius: "4px",
                              border: "none",
                              cursor: "pointer",
                              fontSize: "11px",
                              fontWeight: "bold"
                            }}
                          >
                            {item.statusSave === "processing" ? "⏳ Saving..." : item.statusSave === "success" ? "✓ Tersimpan" : "💾 Simpan"}
                          </button>
                        </td>
                        
                        <td style={{ padding: "12px", fontSize: "11px" }}>
                          {item.statusHtmlPreview !== "success" && <span style={{ color: "#6b7280" }}>Menunggu HTML</span>}
                          {item.statusHtmlPreview === "success" && item.statusConvertTsx !== "success" && item.statusConvertTsx !== "processing-tsx" && item.statusConvertTsx !== "processing-preview" && <span style={{ color: "#38bdf8" }}>HTML Siap, Tekan Generate</span>}
                          {item.statusConvertTsx === "processing-tsx" && <span style={{ color: "#f59e0b", fontWeight: "bold" }}>{"⏳ Convert HTML -> TSX..."}</span>}
                          {item.statusConvertTsx === "processing-preview" && <span style={{ color: "#f59e0b", fontWeight: "bold" }}>⏳ Render Preview MP4...</span>}
                          {item.statusConvertTsx === "success" && <span style={{ color: "#34d399", fontWeight: "bold" }}>✅ Preview Ready</span>}
                          {item.statusConvertTsx === "failed" && <span style={{ color: "#ef4444" }}>❌ Gagal Proses</span>}
                          {item.statusRender4k === "processing" && <span style={{ color: "#f59e0b", fontWeight: "bold" }}>⏳ Rendering 4K ProRes...</span>}
                          {item.statusRender4k === "success" && <span style={{ color: "#34d399", fontWeight: "bold" }}>✅ 4K Rendered</span>}
                          {item.statusRender4k === "failed" && <span style={{ color: "#ef4444" }}>❌ Gagal Render 4K</span>}
                          {item.previewUrl && (
                            <div style={{ marginTop: "6px" }}>
                              <a href={`http://localhost:5000${item.previewUrl}`} target="_blank" rel="noopener noreferrer" style={{ color: "#38bdf8", textDecoration: "underline", fontSize: "11px", fontWeight: "bold" }}>
                                📥 Download Preview
                              </a>
                            </div>
                          )}
                        </td>
                      </tr>
                    </React.Fragment>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* Saved Compositions List */}
          <div style={{ marginTop: "40px", borderTop: "1px solid rgba(56, 189, 248, 0.2)", paddingTop: "30px" }}>
            <h2 style={{ fontSize: "24px", marginBottom: "20px", background: "linear-gradient(to right, #10b981, #38bdf8)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", fontWeight: "bold" }}>
              📂 Saved Compositions & Rendered Videos
            </h2>
            
            {savedItems.length === 0 ? (
              <div style={{ backgroundColor: "#161f32", padding: "20px", borderRadius: "12px", textAlign: "center", color: "#9ca3af", border: "1px solid #1e293b" }}>
                Belum ada item yang disimpan. Jalankan generator atau upload HTML, lalu klik "Simpan" untuk memantau progress rendering 4K Anda di sini.
              </div>
            ) : (
              <table style={{ width: "100%", borderCollapse: "collapse", backgroundColor: "#111827", borderRadius: "12px", overflow: "hidden", fontSize: "13px", border: "1px solid #1e293b" }}>
                <thead>
                  <tr style={{ backgroundColor: "#1f2937", color: "#e5e7eb", textAlign: "left" }}>
                    <th style={{ padding: "12px", width: "40px" }}>No</th>
                    <th style={{ padding: "12px", width: "220px" }}>Deskripsi</th>
                    <th style={{ padding: "12px", width: "200px" }}>Judul</th>
                    <th style={{ padding: "12px", width: "200px" }}>Keywords</th>
                    <th style={{ padding: "12px", width: "120px" }}>Kategori / Durasi</th>
                    <th style={{ padding: "12px", width: "220px" }}>HTML File</th>
                    <th style={{ padding: "12px", width: "180px" }}>Aksi</th>
                    <th style={{ padding: "12px", width: "120px" }}>Status</th>
                  </tr>
                </thead>
                <tbody>
                  {savedItems.map((item, index) => (
                    <tr key={item.id} style={{ borderBottom: "1px solid #1e293b", verticalAlign: "top" }}>
                      <td style={{ padding: "12px", color: "#9ca3af" }}>{index + 1}</td>
                      <td style={{ padding: "12px" }}>
                        <textarea
                          style={{ width: "100%", backgroundColor: "#1f2937", color: "white", border: "1px solid #374151", borderRadius: "4px", padding: "6px", fontSize: "12px" }}
                          rows={3}
                          value={item.deskripsi}
                          onChange={(e) => handleInputChange(index, "deskripsi", e.target.value, true)}
                        />
                      </td>
                      <td style={{ padding: "12px" }}>
                        <input
                          type="text"

                        fontFamily: "monospace", 
                        fontSize: "11px", 
                        color: "#34d399", 
                        backgroundColor: "#07130f", 
                        border: "1px solid #10b981", 
                        borderRadius: "6px", 
                        padding: "10px", 
                        resize: "vertical",
                        minHeight: "120px"
                      }}
                      value={activePreviewItem.htmlPreview}
                    />
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(Dashboard));
  </script>
</body>
</html>
